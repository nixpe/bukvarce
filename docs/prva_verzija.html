<!DOCTYPE html>
<html lang="mk">

<head>
  <meta charset="UTF-8" />
  <title>Раздвојувач на слогови (МК)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --fg: #0f172a;
      --muted: #475569;
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", sans-serif;
      line-height: 1.6;
    }

    .wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
      padding: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #fff;
      font-size: 16px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 12px 0 0;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #0f172a;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: .15s ease-in-out;
      user-select: none;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .out {
      margin-top: 16px;
      padding: 14px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      min-height: 120px;
      max-height: 400px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 22px;
      line-height: 1.8;
      word-break: break-word;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
    }

    /* Highlighting */
    .syll {
      padding: 1px 2px;
      border-radius: 4px;
      transition: all .3s ease;
    }

    .highlight {
      background: yellow;
      font-weight: bold;
      font-size: 36px;
    }

    .correct {
      background: lightgreen !important;
    }

    .wrong {
      background: #fca5a5 !important;
    }

    .dash {
      color: #475569;
      margin: 0 -3px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Раздвојувач на слогови (македонски)</h1>
      <textarea id="inp"></textarea>
      <div class="row">
        <button class="primary" id="btnSplit">Раздвој</button>
        <button id="btnCopy">Копирај излез</button>
        <button id="btnCorrect">Точно</button>
        <button id="btnWrong">Погрешно</button>
        <button id="btnPlay">Пушти</button>
        <button id="btnPause" disabled>Паузирај</button>
      </div>
      <div id="out" class="out"></div>
    </div>
  </div>

  <script>
    let dict = {};
    let dictReady = false;
    let syllCounter = 0, current = -1, total = 0, timer = null;

    function toNFC(s) { return s ? s.normalize('NFC') : s; }
    function stripZW(s) { return s.replace(/[\u200B\u200C\u200D]/g, ''); }
    function latinJtoCyr(word) {
      if (/\p{Script=Cyrillic}/u.test(word))
        return word.replace(/J/g, 'Ј').replace(/j/g, 'ј');
      return word;
    }
    function normKey(s) {
      return stripZW(latinJtoCyr(toNFC(s))).toLowerCase().trim();
    }

    async function loadDict() {
      const status = document.getElementById('status');
      try {
        const res = await fetch('dict.json');
        if (!res.ok) throw new Error(res.status);
        const raw = await res.json();
        for (const [k, v] of Object.entries(raw))
          dict[normKey(k)] = toNFC(String(v));
        dictReady = true;
      } catch (e) {
        dictReady = false;
      }
      safeSplitNow(); 
    }
    loadDict();

    const CYR_WORD_RE = /\p{Script=Cyrillic}+/gu;
    const CYR_LETTER_RE = /\p{Script=Cyrillic}/u;
    const VOWELS = new Set(['а', 'е', 'и', 'о', 'у', 'А', 'Е', 'И', 'О', 'У']);
    const ALLOWED_ONSET3 = new Set(['стр', 'скр', 'спр', 'штр', 'шкр', 'шкл', 'здр']);
    const lc = s => s.toLowerCase();
    function isVowel(c) { return VOWELS.has(c); }
    function isCyr(c) { return CYR_LETTER_RE.test(c); }
    function isSyllR(L, i) {
      const c = L[i]; if (c !== 'р' && c !== 'Р') return false;
      const p = L[i - 1] || '', n = L[i + 1] || ''; return !isVowel(p) && !isVowel(n);
    }
    function allowOnset2(c1, c2) {
      c1 = lc(c1); c2 = lc(c2);
      if (['р', 'л', 'ј', 'в'].includes(c2)) return true;
      if (['с', 'ш'].includes(c1)) return true;
      if (c1 === 'з' && ['г', 'д', 'б', 'в', 'р', 'л', 'ж'].includes(c2)) return true;
      if (c1 === 'ц' && ['р', 'в', 'ј', 'л'].includes(c2)) return true;
      if (c1 === 'ѕ' && ['в', 'д', 'р', 'л'].includes(c2)) return true;
      if (c1 === 'в' && ['ч', 'к', 'л', 'р'].includes(c2)) return true;
      return false;
    }
    function heuristic(word) {
      if (!CYR_LETTER_RE.test(word)) return word;
      const L = [...word], n = L.length, nuclei = [];
      for (let i = 0; i < n; i++)if (isVowel(L[i]) || isSyllR(L, i)) nuclei.push(i);
      if (nuclei.length <= 1) return word;
      const cuts = new Set();
      for (let j = 1; j < nuclei.length; j++) {
        const prev = nuclei[j - 1], curr = nuclei[j]; let m = 0;
        for (let k = curr - 1; k > prev; k--) {
          const ch = L[k]; if (isVowel(ch) || isSyllR(L, k)) break;
          if (isCyr(ch)) m++; else break;
        }
        let cut = curr;
        if (m === 1) cut = curr - 1;
        else if (m === 2) cut = allowOnset2(L[curr - 2], L[curr - 1]) ? curr - 2 : curr - 1;
        else if (m >= 3) {
          const trio = lc(L[curr - 3] + L[curr - 2] + L[curr - 1]);
          cut = ALLOWED_ONSET3.has(trio) ? curr - 3 : (allowOnset2(L[curr - 2], L[curr - 1]) ? curr - 2 : curr - 1);
        }
        cuts.add(cut);
      }
      let out = ''; for (let i = 0; i < n; i++) { if (cuts.has(i)) out += '-'; out += L[i]; }
      return out;
    }
    function applyDictWithCasing(word, dictSplit) {
      const parts = String(dictSplit).split('-');
      const letters = [...word]; let pos = 0, out = [];
      for (const p of parts) {
        const len = [...p].length;
        out.push(letters.slice(pos, pos + len).join('')); pos += len;
      }
      if (pos !== letters.length) return dictSplit;
      return out.join('-');
    }
    function syllabifyWord(w) {
      const key = normKey(w);
      if (dictReady && dict.hasOwnProperty(key)) {
        try { return applyDictWithCasing(w, dict[key]); } catch { return dict[key]; }
      }
      return heuristic(w);
    }
    function processText(t, spans = false) {
      const norm = stripZW(toNFC(t));
      return norm.replace(CYR_WORD_RE, w => {
        const s = syllabifyWord(w);
        if (!spans) return s;
        const parts = s.split('-');
        return parts.map((sy, i) =>
          `<span class="syll" data-idx="${syllCounter++}">${sy}</span>`
        ).join('<span class="dash">-</span>');
      });
    }

    const inp = document.getElementById('inp');
    const out = document.getElementById('out');
    const btnSplit = document.getElementById('btnSplit');
    const btnCopy = document.getElementById('btnCopy');
    const btnCorrect = document.getElementById('btnCorrect');
    const btnWrong = document.getElementById('btnWrong');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');

    function splitNow() {
      syllCounter = 0;
      out.innerHTML = processText(inp.value, true).replace(/\n/g, '<br>');
      total = out.querySelectorAll('.syll').length;
      current = 0;
    }
    function safeSplitNow() { try { splitNow(); highlight(current) } catch (e) { console.error(e); } }

    btnSplit.addEventListener('click', safeSplitNow);
    inp.addEventListener('input', safeSplitNow);
    btnCopy.addEventListener('click', () => navigator.clipboard.writeText(out.textContent || ''));

    // ---------- Highlighting ----------
    function highlight(idx) {
      out.querySelectorAll('.syll').forEach(e => e.classList.remove('highlight'));
      const el = out.querySelector(`[data-idx="${idx}"]`);
      if (el) el.classList.add('highlight');
    }
    function nextSyll(correct = true) {
      if (total === 0) return;
      if (current >= 0) {
        const el = out.querySelector(`[data-idx="${current}"]`);
        if (el) {
          el.classList.add(correct ? 'correct' : 'wrong');
          setTimeout(() => el.classList.remove('correct', 'wrong'), 300);
        }
      }
      if (correct)
        current = (current + 1) % total;

      highlight(current);
    }

    btnCorrect.addEventListener('click', () => nextSyll(true));
    btnWrong.addEventListener('click', () => nextSyll(false));
    btnPlay.addEventListener('click', () => {
      if (timer) return;
      timer = setInterval(() => nextSyll(true), 1000);
      btnPlay.disabled = true;
      btnPause.disabled = false;
    });
    btnPause.addEventListener('click', () => {
      clearInterval(timer);
      timer = null;
      btnPlay.disabled = false;
      btnPause.disabled = true;
    });

    // ---------- Demo ----------
    inp.value = `Бидејќи не беше повисока од еден палец,
ја нарекоа Палешка.

Една ноќ, додека спиеше сама во своето креветче од орев,
една страшна жаба скокна низ прозорецот
и се најде право на масата каде што спиеше Палешка.`;
    safeSplitNow();
  </script>
</body>

</html>
