<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
  <title id="title">Тек на еден круг на читање</title>
  <desc id="desc">Чекори од избор на текст, режим и проверка, до слоговно читање, напредок и следно ниво, со чисто распореден тек без преклопени линии.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f6fbff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#45617a"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #163a5f; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #4e6e8c; }
      .box { stroke-width: 4; rx: 28; fill: #fff; }
      .step-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #163a5f; }
      .step-text { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #2c506e; }
      .line { stroke: #45617a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="1160" rx="34" fill="url(#bg)"/>
  <text x="70" y="80" class="title">Тек на еден читачки круг</text>
  <text x="70" y="115" class="subtitle">Од избор на текст и режим, до микрофон/проверка, прослава и следно ниво</text>

  <!-- Top row -->
  <rect class="box" x="70" y="170" width="280" height="150" stroke="#ffe2b5"/>
  <text x="105" y="225" class="step-title">1. Избор на содржина</text>
  <text x="105" y="265" class="step-text">Ниво, sample текст, фото</text>
  <text x="105" y="292" class="step-text">или рачно пишување</text>

  <rect class="box" x="400" y="170" width="280" height="150" stroke="#d2efe1"/>
  <text x="435" y="225" class="step-title">2. Режим</text>
  <text x="435" y="265" class="step-text">`Игра` со ѕвезди</text>
  <text x="435" y="292" class="step-text">или `Вежбање` со слушање</text>

  <rect class="box" x="730" y="170" width="280" height="150" stroke="#c9e5f7"/>
  <text x="765" y="225" class="step-title">3. Проверка</text>
  <text x="765" y="265" class="step-text">Микрофон или</text>
  <text x="765" y="292" class="step-text">рачна проверка ✅❌</text>

  <rect class="box" x="1060" y="170" width="270" height="150" stroke="#f6d0d8"/>
  <text x="1095" y="225" class="step-title">4. Рендерирање</text>
  <text x="1095" y="265" class="step-text">Текстот се дели на</text>
  <text x="1095" y="292" class="step-text">слогови и се означува почеток</text>

  <!-- Center box -->
  <rect class="box" x="540" y="390" width="320" height="170" stroke="#d8d7ff"/>
  <text x="575" y="445" class="step-title">5. Тековен слог</text>
  <text x="575" y="485" class="step-text">Се чита, се слуша или</text>
  <text x="575" y="512" class="step-text">се проверува преку микрофон</text>
  <text x="575" y="539" class="step-text">и voice-match логика</text>

  <!-- Branches below -->
  <rect class="box" x="180" y="650" width="320" height="170" stroke="#ffe2b5"/>
  <text x="215" y="705" class="step-title">6A. Успех</text>
  <text x="215" y="745" class="step-text">Слогот се чисти, се додава</text>
  <text x="215" y="772" class="step-text">score/streak и се оди понатаму</text>
  <text x="215" y="799" class="step-text">можно е и повеќе слогови одеднаш</text>

  <rect class="box" x="900" y="650" width="320" height="170" stroke="#f6d0d8"/>
  <text x="935" y="705" class="step-title">6B. Грешка / retry</text>
  <text x="935" y="745" class="step-text">Се брои mistake, streak се ресетира</text>
  <text x="935" y="772" class="step-text">и се останува на истиот дел</text>
  <text x="935" y="799" class="step-text">или се користи `Слушни` / `Прескокни`</text>

  <!-- Bottom row -->
  <rect class="box" x="180" y="900" width="360" height="170" stroke="#c9e5f7"/>
  <text x="215" y="955" class="step-title">7. Напредок</text>
  <text x="215" y="995" class="step-text">Hero badge, progress fill, stickers,</text>
  <text x="215" y="1022" class="step-text">next goal, level и achievement badge</text>

  <rect class="box" x="860" y="900" width="420" height="170" stroke="#d2efe1"/>
  <text x="895" y="955" class="step-title">8. Крај на круг</text>
  <text x="895" y="995" class="step-text">Star rating, celebration overlay,</text>
  <text x="895" y="1022" class="step-text">recordCompletedLevel и следно ниво</text>

  <!-- Top flow -->
  <path class="line" d="M350 245 H390"/>
  <path class="line" d="M680 245 H720"/>
  <path class="line" d="M1010 245 H1050"/>
  <path class="line" d="M1195 320 V355 H700 V380"/>

  <!-- 5 to branches -->
  <path class="line" d="M700 560 V595 H340 V640"/>
  <path class="line" d="M700 595 H1028 V640"/>

  <!-- 6A to 7 -->
  <path class="line" d="M340 820 V890"/>

  <!-- 7 to 5 -->
  <path class="line" d="M260 900 V860 H80 V475 H530"/>

  <!-- 7 to 8 -->
  <path class="line" d="M540 985 H850"/>

  <!-- 6B to 5 -->
  <path class="line" d="M1060 650 V610 H1320 V475 H870"/>

  <text x="1270" y="1125" class="step-text" text-anchor="end">Читачки циклус • игра и вежбање</text>
</svg>
