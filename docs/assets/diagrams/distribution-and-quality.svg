<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Испорака и квалитет</title>
  <desc id="desc">Дијаграм за локален старт, тестирање и single-file build.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f8fcff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4d6a81"/>
    </marker>
    <marker id="arrow-down" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4d6a81"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #163a5f; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #4e6e8c; }
      .box-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #163a5f; }
      .box-text { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #2f526f; }
      .line { stroke: #4d6a81; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .line-plain { stroke: #4d6a81; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="80" class="title">Испорака, тестирање и self-contained build</text>
  <text x="70" y="115" class="subtitle">Проектот може да се користи како локален static app или како единечен HTML фајл</text>

  <rect x="90" y="190" width="320" height="180" rx="26" fill="#fff" stroke="#c9e5f7" stroke-width="4"/>
  <text x="125" y="245" class="box-title">Изворен код</text>
  <text x="125" y="285" class="box-text">`index.html`, `styles/main.css`,</text>
  <text x="125" y="312" class="box-text">`src/*`, `dict.json`, `favicon.svg`</text>
  <text x="125" y="339" class="box-text">+ тестови и build script</text>

  <rect x="470" y="190" width="320" height="180" rx="26" fill="#fff" stroke="#d2efe1" stroke-width="4"/>
  <text x="505" y="245" class="box-title">Развој и проверки</text>
  <text x="505" y="285" class="box-text">`npm start` → local static server</text>
  <text x="505" y="312" class="box-text">`npm test` → unit + smoke</text>
  <text x="505" y="339" class="box-text">`npm run audit:dict`</text>

  <rect x="850" y="190" width="460" height="180" rx="26" fill="#fff" stroke="#ffe2b5" stroke-width="4"/>
  <text x="885" y="245" class="box-title">Single-file build</text>
  <text x="885" y="285" class="box-text">`npm run build:single` ги вградува CSS, JS, favicon</text>
  <text x="885" y="312" class="box-text">и `dict.json` во `dist/index.html`</text>
  <text x="885" y="339" class="box-text">→ погоден за лесна испорака и демонстрација</text>

  <rect x="170" y="470" width="360" height="170" rx="26" fill="#fff" stroke="#f6d0d8" stroke-width="4"/>
  <text x="205" y="525" class="box-title">Квалитетен слој</text>
  <text x="205" y="565" class="box-text">Слогување, voice-match, progression,</text>
  <text x="205" y="592" class="box-text">sample texts и smoke coverage</text>

  <rect x="670" y="470" width="520" height="170" rx="26" fill="#fff" stroke="#d8d7ff" stroke-width="4"/>
  <text x="705" y="525" class="box-title">Испорака до корисник</text>
  <text x="705" y="565" class="box-text">1. Локално преку `http://127.0.0.1:8083/`</text>
  <text x="705" y="592" class="box-text">2. Како standalone `dist/index.html`</text>
  <text x="705" y="619" class="box-text">3. Како демонстрациски артефакт за одбрана / матурска презентација</text>

  <path class="line" d="M410 280 H460"/>
  <path class="line" d="M790 280 H840"/>
  <path class="line-plain" d="M630 370 V450 H350 V458"/>
  <polygon points="336,458 364,458 350,470" fill="#4d6a81"/>
  <path class="line-plain" d="M1080 370 V450 H930 V458"/>
  <polygon points="916,458 944,458 930,470" fill="#4d6a81"/>
  <text x="1260" y="705" class="box-text" text-anchor="end">Старт, тест, build и испорака</text>
</svg>
