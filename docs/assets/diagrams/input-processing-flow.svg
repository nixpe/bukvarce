<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Тек на обработка на текст и интеграции</title>
  <desc id="desc">Дијаграм за патеките од sample текст, OCR и микрофон до слогување и UI реакција.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fcff"/>
      <stop offset="100%" stop-color="#fffaf4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#476683"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #163a5f; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #4e6e8c; }
      .box-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #163a5f; }
      .box-text { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #2f526f; }
      .line { stroke: #476683; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="860" rx="34" fill="url(#bg)"/>
  <text x="70" y="80" class="title">Тек на текст, фото и глас</text>
  <text x="70" y="115" class="subtitle">Три различни влеза се спојуваат во една заедничка патека за читање</text>

  <rect x="80" y="180" width="320" height="170" rx="26" fill="#fff" stroke="#ffe2b5" stroke-width="4"/>
  <text x="115" y="235" class="box-title">A. Sample ниво / текст</text>
  <text x="115" y="275" class="box-text">`sample-texts.mjs`</text>
  <text x="115" y="302" class="box-text">Одделение, тежина, должина,</text>
  <text x="115" y="329" class="box-text">наслов и textbook attribution</text>

  <rect x="80" y="410" width="320" height="170" rx="26" fill="#fff" stroke="#c9e5f7" stroke-width="4"/>
  <text x="115" y="465" class="box-title">B. Фото-внес</text>
  <text x="115" y="505" class="box-text">`ocr.mjs` + Tesseract.js</text>
  <text x="115" y="532" class="box-text">`mkd+eng`, а потоа fallback `eng`</text>
  <text x="115" y="559" class="box-text">Резултатот прво се прегледува</text>

  <rect x="80" y="640" width="320" height="150" rx="26" fill="#fff" stroke="#f6d0d8" stroke-width="4"/>
  <text x="115" y="695" class="box-title">C. Микрофон</text>
  <text x="115" y="735" class="box-text">`recognizeOnce` + `voice-match.mjs`</text>
  <text x="115" y="762" class="box-text">Quick match и settle delay</text>

  <rect x="520" y="180" width="360" height="250" rx="28" fill="#fff" stroke="#d2efe1" stroke-width="4"/>
  <text x="555" y="235" class="box-title">Заедничка обработка на текст</text>
  <text x="555" y="275" class="box-text">1. `normalizeText` / `normalizeWord`</text>
  <text x="555" y="305" class="box-text">2. `tokenizeText`</text>
  <text x="555" y="335" class="box-text">3. dictionary lookup</text>
  <text x="555" y="365" class="box-text">4. `segmentWordByRules`</text>
  <text x="555" y="395" class="box-text">5. render во `outputText`</text>

  <rect x="980" y="180" width="320" height="250" rx="28" fill="#fff" stroke="#d8d7ff" stroke-width="4"/>
  <text x="1015" y="235" class="box-title">UI реакција</text>
  <text x="1015" y="275" class="box-text">• тековен слог</text>
  <text x="1015" y="305" class="box-text">• correct / wrong feedback</text>
  <text x="1015" y="335" class="box-text">• hint, skip, playback</text>
  <text x="1015" y="365" class="box-text">• status banner</text>
  <text x="1015" y="395" class="box-text">• mission progress</text>

  <rect x="520" y="520" width="360" height="210" rx="28" fill="#fff" stroke="#ffe2b5" stroke-width="4"/>
  <text x="555" y="575" class="box-title">Voice match логика</text>
  <text x="555" y="615" class="box-text">Изговорот се нормализира,</text>
  <text x="555" y="642" class="box-text">се споредува со тековниот и</text>
  <text x="555" y="669" class="box-text">следните слогови и може да</text>
  <text x="555" y="696" class="box-text">помести повеќе слогови одеднаш</text>

  <rect x="980" y="520" width="320" height="210" rx="28" fill="#fff" stroke="#cfe9d4" stroke-width="4"/>
  <text x="1015" y="575" class="box-title">Резултат</text>
  <text x="1015" y="615" class="box-text">• success / retry / skip</text>
  <text x="1015" y="645" class="box-text">• stars и streak</text>
  <text x="1015" y="675" class="box-text">• celebration + next level</text>

  <path class="line" d="M400 265 H510"/>
  <path class="line" d="M400 495 H455 V340 H510"/>
  <path class="line" d="M400 715 H520"/>
  <path class="line" d="M880 305 H970"/>
  <path class="line" d="M880 625 H970"/>
  <path class="line" d="M1140 430 V505"/>
  <text x="1260" y="810" class="box-text" text-anchor="end">Обработка на влезови и реакција на системот</text>
</svg>
